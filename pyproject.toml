[project]
name = "cmm"
version = "0.1.0"
description = "Cyberpunk Mod Manager: simple mod installer for the native macOS game (GOG/Steam)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cmm = "cmm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
